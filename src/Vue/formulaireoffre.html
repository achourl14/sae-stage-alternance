<form method="post" action="controleurFrontal.php?action=creerOffre">
    <h1> Création d'une offre par une entreprise </h1>
        <p>
            <label for="idEntreprise">Numéro Siret de  l'entreprise qui propose l'offre </label> :
            <input  type="text" placeholder="" name="Entreprise" id="idEntreprise" required/>
        </p>

        <p>
            <label for="idnom">Nom de l'offre </label> :
            <input maxlength="50" type="text" placeholder="" name="nomOffre" id="idnom" required/>
        </p>

        <p>
            <label for="mission">Mission </label>
            <textarea maxlength="500" id="mission" name="mission" required></textarea>
        </p>
        <p>
            <fieldset>
                <legend> Stage / Alternance :</legend>
                <div>
                  <label for="stage">Stage </label> :
                  <input type="radio" placeholder="" name="offre" id="stage" value="1" required/>
                </div>
                 <div>
                   <label for="alternance">Alternance </label> :
                   <input type="radio" placeholder="" name="offre" id="alternance" value="2" required/>
                </div>
            </fieldset>
        </p>

        <p>
            <input type="submit" value="Envoyer" />
        </p>
</form>
