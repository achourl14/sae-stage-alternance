<div class="container">
<form method="post" action="controleurFrontal.php?action=creerOffre">
    <h1 class="title"> Création d'une offre par une entreprise </h1>
    <div class="user-details">
        <div class="input-box">
            <label for="idEntreprise" class="details">Numéro Siret de  l'entreprise </label>
            <input  type="text" placeholder="" name="Entreprise" id="idEntreprise" required/>
        </div>

        <div class="input-box">
            <label class="details" for="idnom">Nom de l'offre </label>
            <input maxlength="50" type="text" placeholder="" name="nomOffre" id="idnom" required/>
        </div>

        <div class="input-box">
            <label class="details" for="mission">Mission </label>
            <textarea rows="5" cols="75" maxlength="500" id="mission" name="mission" required></textarea>
        </div>
        <div class="category input-box">
            <fieldset>
                <legend> Stage / Alternance :</legend>
                <div>
                  <label class="details" for="stage">Stage </label>
                  <input type="radio" placeholder="" name="offre" id="stage" value="1" required/>
                </div>
                 <div>
                   <label class="details" for="alternance">Alternance </label>
                   <input type="radio" placeholder="" name="offre" id="alternance" value="2" required/>
                </div>
            </fieldset>
        </div>

        <div class="button">
            <input type="submit" value="Envoyer" />
        </div>
    </div>
</form>
</div>
