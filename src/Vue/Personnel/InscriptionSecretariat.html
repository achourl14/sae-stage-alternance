<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription Secrétaire</title>
    <link rel="stylesheet" href="styles/css/style_inscription.css">
    <link rel="stylesheet" href="styles/css/style_form.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div class="contient">
    <div class="container">
        <div class="title">Inscription Personnel de l'IUT</div>
        <div class="content">
            <form method="post" name="inscription" action="controleurFrontal.php?controleur=personnel&action=creerSecretaire">
                <div class="user-details">
                    <div class="input-box">
                        <span class="details">login Personnel</span>
                        <input type="text" name="login" maxlength="50" required/>
                    </div>
                    <div class="input-box">
                        <span class="details">Nom Personnel</span>
                        <input type="text" placeholder="" name="nomSecretariat" maxlength="50" required>
                    </div>
                    <div class="input-box">
                        <span class="details">Prénom Personnel</span>
                        <input type="text" placeholder="" name="prenomSecretariat" maxlength="100" required>
                    </div>
                    <div class="input-box">
                        <span class="details">Date de Naissance </span>
                        <input type="date" name="dateDeNaissanceSecretariat" required>
                    </div>
                    <div class="input-box">
                        <span class="details">Mail</span>
                        <input type="email" name="mailSecretariat" maxlength="100" required>
                    </div>
                    <div class="input-box">
                        <span class="details">Téléphone</span>
                        <input type="tel"  name="telephoneSecretariat" pattern="[0-9]{10}" maxlength="10" required>
                    </div>
                    <div class="input-box">
                        <label class="details" for="roleCible"> Rôle </label>
                        <select name="role" id="roleCible" required>
                            <option value="T"> Tuteur </option>
                            <option value="S"> Secretariat </option>
                            <option value="M"> Maitre Stage/Alternance (Admin) </option>
                        </select>
                    </div>
                    <div class="input-box">
                        <span class="details">Mot de passe</span>
                        <input type="password" placeholder="" name="mdp" required>
                    </div>
                </div>
                <div class="button">
                    <input type="submit" value="S'inscrire">
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
