<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <title> Inscription </title>
    <link rel="stylesheet" href="styles/style_inscription.css">
    <link rel="stylesheet" href="styles/style_form.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div class="container">
    <div class="title">Connexion Etudiant / Entreprise</div>
    <div class="content">
        <form action="#">
            <div class="user-details">
                <div class="input-box">
                    <span class="details">Email</span>
                    <input type="email" placeholder="" name="mail" required>
                </div>
                <div class="input-box">
                    <span class="details">Mot de passe</span>
                    <input type="password" placeholder="" name="motdepasse" required>
                </div>
            </div>
            <div class="button">
                <input type="submit" value="Connexion">
            </div>
        </form>
    </div>
</div>

</body>
</html>
