<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <title> Inscription </title>
    <link rel="stylesheet" href="styles/css/style_inscription.css">
    <link rel="stylesheet" href="styles/css/style_form.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div class="contient">
<div class="container">
    <div class="title">Connexion Etudiant / Entreprise et Personnel IUT</div>
    <div class="content">
        <form method="post" action="controleurFrontal.php?controleur=generique&action=connecter">
            <div class="user-details">
                <div class="category">
                    <span class="details">Personnel de l'IUT</span>
                    <input type="radio" name="type_connexion" value="secretariat">
                    <span class="details">Etudiant</span>
                    <input type="radio" name="type_connexion" value="etudiant" checked>
                    <span class="details">Entreprise</span>
                    <input type="radio"  name="type_connexion" value="entreprise">
                </div>
                <div class="input-box">
                    <span class="details">Login</span>
                    <input type="text" placeholder="" name="login" required>
                </div>
                <div class="input-box">
                    <span class="details">Mot de passe</span>
                    <input type="password" placeholder="" name="mdp" required>
                </div>
            </div>
            <div class="button">
                <input type="submit" value="Connexion">
            </div>
        </form>
    </div>
</div>
</div>
</body>
</html>
