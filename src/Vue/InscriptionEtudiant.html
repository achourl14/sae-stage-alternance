<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription Etudiant</title>
    <link rel="stylesheet" href="styles/css/style_inscription.css">
    <link rel="stylesheet" href="styles/css/style_form.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div class="contient">
    <div class="container">
        <div class="title">Inscription Etudiant</div>
        <div class="content">
            <form method="post" name="inscription" action="controleurFrontal.php?action=creerEtudiant">
                <div class="user-details">
                    <div class="input-box">
                        <span class="details">code INE</span>
                        <input type="text" name="codeINE" maxlength="11" required/>
                    </div>
                    <div class="input-box">
                        <span class="details">code Etudiant</span>
                        <input type="text" placeholder="" name="codeEtudiant" maxlength="8" required>
                    </div>
                    <div class="input-box">
                        <span class="details">Nom Etudiant</span>
                        <input type="text" placeholder="" name="nomEtudiant" maxlength="100" required>
                    </div>
                    <div class="input-box">
                        <span class="details">Prénom Etudiant</span>
                        <input type="text" placeholder="" name="prenomEtudiant" maxlength="100" required>
                    </div>
                    <div class="input-box">
                        <span class="details">Promotion</span>
                        <input type="text" placeholder="" name="promotion" maxlength="1" required>
                    </div>
                    <div class="input-box">
                        <span class="details">Groupe</span>
                        <input type="text" placeholder="" name="groupe" maxlength="2" required>
                    </div>
                    <div class="input-box">
                        <span class="details">Parcours</span>
                        <input type="text" placeholder="" name="parcours" maxlength="5" required>
                    </div>
                    <div class="input-box">
                        <span class="details">mailEtudiant</span>
                        <input type="email" placeholder="" name="mail" maxlength="100" required>
                    </div>
                    <div class="input-box">
                        <span class="details">mail Personel</span>
                        <input type="tel" placeholder="" name="mailPerso" maxlength="100" required>
                    </div>
                    <div class="input-box">
                        <label class="details" for="sex"> Sexe </label>
                        <select name="sexe" id="sex" required>
                            <option value="M">Masculin</option>
                            <option value="F"> Féminin </option>
                        </select>
                    </div>
                    <div class="input-box">
                        <span class="details">telephoneEtudiant</span>
                        <input type="tel" placeholder="" name="telephone" maxlength="10" required>
                    </div>
                    <div class="input-box">
                        <span class="details">Date de naissance</span>
                        <input type="date" placeholder="" name="dateDeNaissance" required>
                    </div>
                    <div class="input-box">
                        <span class="details">Mot de passe</span>
                        <input type="password" placeholder="" name="mdp" maxlength="256" required>
                    </div>
                </div>
                <div class="button">
                    <input type="submit" value="S'inscrire">
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
