<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription Secrétaire</title>
    <link rel="stylesheet" href="styles/css/style_inscription.css">
    <link rel="stylesheet" href="styles/css/style_form.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div class="contient">
    <div class="container">
        <div class="title">Inscription Secrétaire</div>
        <div class="content">
            <form method="post" name="inscription" action="controleurFrontal.php?action=creerSecretaire">
                <div class="user-details">
                    <div class="input-box">
                        <span class="details">login Secrétaire</span>
                        <input type="text" name="idSecretariat" required/>
                    </div>
                    <div class="input-box">
                        <span class="details">Nom Secrétaire</span>
                        <input type="text" placeholder="" name="nomSecretariat" maxlength="50" required>
                    </div>
                    <div class="input-box">
                        <span class="details">Prénom Secrétaire</span>
                        <input type="text" placeholder="" name="prenomSecretariat" maxlength="100" required>
                    </div>
                    <div class="input-box">
                        <span class="details">Mot de passe</span>
                        <input type="tel" placeholder="" name="mdp" required>
                    </div>
                </div>
                <div class="button">
                    <input type="submit" value="S'inscrire">
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
