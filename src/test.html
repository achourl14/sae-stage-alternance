<!DOCTYPE html>
<html>
<head>
    <title>Vérification en temps réel</title>
</head>
<body>

<form>
    <label for="nom">Nom :</label>
    <input type="text" id="nom" onblur="verifierEtudiant()" required>
    <div id="resultat"></div>
    <input type="submit" value="Envoyer">
</form>

<script>
    function verifierEtudiant() {
        var nom = document.getElementById("nom").value;

        // Effectuez une requête AJAX vers votre base de données pour vérifier si l'étudiant existe
        // Voici un exemple en utilisant Fetch API (vous devrez remplacer l'URL et la méthode avec les vôtres)
        fetch('verifier_etudiant.php', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ nom: nom }),
        })
            .then(response => response.json())
            .then(data => {
                var resultatDiv = document.getElementById("resultat");
                if (data.existe) {
                    resultatDiv.innerHTML = "L'étudiant existe dans la base de données.";
                } else {
                    resultatDiv.innerHTML = "L'étudiant n'existe pas dans la base de données.";
                }
            })
            .catch((error) => {
                console.error('Erreur :', error);
            });
    }
</script>

</body>
</html>
