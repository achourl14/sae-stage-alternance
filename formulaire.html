<!DOCTYPE html>
<html>
<head>
    <title> Formulaire Type </title>
</head>
<body>
<form method="post" action="">
    <fieldset>
        <legend>Mon formulaire :</legend>
        <p>
            <label for="immat_id">Immatriculation</label> :
            <input type="text" placeholder="AB237KV" name="immatriculation" id="immat_id" required/>
        </p>

        <p>
            <label for="marque_id">Marque</label> :
            <input type="text" placeholder="Renault" name="marque" id="marque_id" required/>
        </p>
        <p>
            <label for="coul_id">Couleur</label> :
            <input type="text" placeholder="grise" name="couleur" id="coul_id" required/>
        </p>
        <p>
            <label for="siege_id">Siege</label> :
            <input type="number" placeholder="5" name="siege" id="siege_id" required/>
        </p>
        <p>
            <input type="submit" value="Envoyer" />
        </p>
    </fieldset>
</form>

</body>
</html>
