<form method="post" action="">
    <h1> Inscription Entreprise </h1>
        <p>
            <label for="num_SIRE">Numéro SIRE</label> :
            <input type="text" placeholder="" name="numSIRE" id="num_SIRE" required/>
        </p>

        <p>
            <label for="nom">Nom de l'Entreprise</label> :
            <input type="text" placeholder="" name="nomEntreprise" id="nom" required/>
        </p>
        <p>
            <label for="adresse">Adresse</label> :
            <input type="text" placeholder="" name="adresse" id="adresse" required/>
        </p>
        <p>
            <label for="tel">Téléphone</label> :
            <input type="text" placeholder="" name="telephone" id="tel" required/>
        </p>

        <p>
            <label for="email">Adresse Mail</label> :
            <input type="text" placeholder="" name="mail" id="email" required/>
        </p>

        <p>
            <label for="interlec">Interlocuteur</label> :
            <input type="text" placeholder="" name="interlocuteur" id="interlec" required/>
        </p>

        <p>
            <label for="code_ape">Code APE</label> :
            <input type="text" placeholder="" name="codeAPE" id="code_ape" required/>
        </p>

        <p>
            <label for="activite">Secteur d'Activité</label> :
            <input type="text" placeholder="" name="secteur" id="activite" required/>
        </p>

        <p>
            <label for="motpasse">Mot de passe</label> :
            <input type="text" placeholder="" name="mdp" id="motpasse" required/>
        </p>

        <p>
            <input type="submit" value="Envoyer" />
        </p>
